<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Edwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one Emacs frame filling the page — command bar, a single window with a number gutter,
   a mode line led by the Evil state, and the echo area that doubles as the : and / prompt. */
/* Palette: modus-operandi-tinted (light) and modus-vivendi-tinted (dark), the themes the
   configuration follows from the desktop; the page follows the viewer's theme instead.
   Region, function names (magenta), docstrings (green-faint / cyan-faint) and comments
   (red-faint) are the modus-themes 4.4 tinted values. */
:root {
  --page: #efe9dd; --bg: #fbf7f0; --fg: #000000; --dim: #595959; --rule: #c4b8ab; --gutter: #7f7f7f;
  --menu-bg: #efe9dd; --menu-fg: #3a3a3a; --ml-bg: #cab9b2; --ml-fg: #000000; --ml-dim: #3a3a3a; --ml-inactive: #dfd9cf;
  --cursor: #000000; --cursor-fg: #fbf7f0; --region: #c2bcb5; --match: #79a8ff; --lazy: #c0efff;
  --paren: #7fdfcf; --mismatch: #ffa0a0; --bell: #a60000; --hl: #f1d5d0; --pulse: #ffdfa0;
  --kw: #531ab6; --fn: #721045; --st: #3548cf; --dc: #2a5045; --cm: #7f0000; --co: #0000b0; --pa: #7f7f7f;
  --rb0: #0000b0; --rb1: #a60000; --rb2: #006800; --rb3: #884900; --rb4: #721045; --rb5: #005e8b;
  --avy-bg: #ffc000; --avy-fg: #000000;
  --s-normal: #3548cf; --s-insert: #006800; --s-visual: #884900; --s-replace: #a60000; --s-operator: #595959;
  --s-motion: #005e8b; --s-emacs: #531ab6; --s-fg: #ffffff;
  --cursor-normal: #a60000; --cursor-insert: #006800; --cursor-emacs: #005e8b; --cursor-visual: #884900; --cursor-replace: #a60000;
  --snipe: #ffc000;
  --text-size: 14px;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0e1c; --bg: #0d0e1c; --fg: #ffffff; --dim: #989898; --rule: #3d3f5a; --gutter: #7e7e7e;
    --menu-bg: #1d2235; --menu-fg: #b8b8b8; --ml-bg: #484d67; --ml-fg: #ffffff; --ml-dim: #cfcfcf; --ml-inactive: #292d48;
    --cursor: #ff66ff; --cursor-fg: #0d0e1c; --region: #555a66; --match: #2f7f9f; --lazy: #1f3f4f;
    --paren: #2f7f9f; --mismatch: #7f1f1f; --bell: #ff5f59; --hl: #303a6f; --pulse: #5f4f2f;
    --kw: #b6a0ff; --fn: #feacd0; --st: #79a8ff; --dc: #9ac8e0; --cm: #ff9f80; --co: #00bcff; --pa: #7e7e7e;
    --rb0: #00bcff; --rb1: #ff5f59; --rb2: #44bc44; --rb3: #fec43f; --rb4: #feacd0; --rb5: #00d3d0;
    --avy-bg: #d0bc00; --avy-fg: #000000;
    --s-normal: #79a8ff; --s-insert: #44bc44; --s-visual: #d0bc00; --s-replace: #ff5f59; --s-operator: #989898;
    --s-motion: #00d3d0; --s-emacs: #b6a0ff; --s-fg: #0d0e1c;
    --cursor-normal: #ff5f59; --cursor-insert: #44bc44; --cursor-emacs: #00d3d0; --cursor-visual: #d0bc00; --cursor-replace: #ff5f59;
    --snipe: #d0bc00;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0e1c; --bg: #0d0e1c; --fg: #ffffff; --dim: #989898; --rule: #3d3f5a; --gutter: #7e7e7e;
  --menu-bg: #1d2235; --menu-fg: #b8b8b8; --ml-bg: #484d67; --ml-fg: #ffffff; --ml-dim: #cfcfcf; --ml-inactive: #292d48;
  --cursor: #ff66ff; --cursor-fg: #0d0e1c; --region: #555a66; --match: #2f7f9f; --lazy: #1f3f4f;
  --paren: #2f7f9f; --mismatch: #7f1f1f; --bell: #ff5f59; --hl: #303a6f; --pulse: #5f4f2f;
  --kw: #b6a0ff; --fn: #feacd0; --st: #79a8ff; --dc: #9ac8e0; --cm: #ff9f80; --co: #00bcff; --pa: #7e7e7e;
  --rb0: #00bcff; --rb1: #ff5f59; --rb2: #44bc44; --rb3: #fec43f; --rb4: #feacd0; --rb5: #00d3d0;
  --avy-bg: #d0bc00; --avy-fg: #000000;
  --s-normal: #79a8ff; --s-insert: #44bc44; --s-visual: #d0bc00; --s-replace: #ff5f59; --s-operator: #989898;
  --s-motion: #00d3d0; --s-emacs: #b6a0ff; --s-fg: #0d0e1c;
  --cursor-normal: #ff5f59; --cursor-insert: #44bc44; --cursor-emacs: #00d3d0; --cursor-visual: #d0bc00; --cursor-replace: #ff5f59;
  --snipe: #d0bc00;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--fg); margin: 0;
  padding-inline: 16px; padding-block: 14px; box-sizing: border-box;
  font-family: var(--font-mono);
}
#frame {
  height: 100%; display: flex; flex-direction: column; min-width: 0; position: relative;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden;
  box-shadow: 0 1px 0 var(--rule), 0 12px 32px -18px rgb(20 24 36 / 0.35);
}
#menubar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; padding: 4px 8px;
  background: var(--menu-bg); border-bottom: 1px solid var(--rule);
  font-family: var(--font-ui); font-size: 13px; color: var(--menu-fg);
}
#menubar .name { font-weight: 600; letter-spacing: 0.04em; color: var(--fg); margin-right: 6px; }
#menubar button {
  font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 4px;
  padding: 2px 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
#menubar button:hover { background: var(--bg); border-color: var(--rule); }
#menubar button:focus-visible { outline: 2px solid var(--cursor); outline-offset: 1px; }
#menubar kbd { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
#menubar .spacer { flex: 1; }
#menubar .hint { font-size: 12px; color: var(--dim); }
#windows { flex: 1; min-height: 0; display: flex; flex-direction: column; min-width: 0; }
#windows > * { flex: 1; min-height: 0; min-width: 0; }
.split { display: flex; min-height: 0; min-width: 0; }
.split.v { flex-direction: column; }
.split.h { flex-direction: row; }
.split > * { flex: 1; min-height: 0; min-width: 0; }
.split.h > * + * { border-left: 1px solid var(--rule); }
.win { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.text {
  flex: 1; min-height: 0; overflow: hidden; position: relative;
  margin: 0; padding: 6px 10px 6px 12px;
  font-size: var(--text-size); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 8;
  cursor: text; user-select: none; -webkit-user-select: none;
}
.text.nowrap { white-space: pre; overflow-x: auto; overflow-wrap: normal; }
.text.nowrap .ln { width: max-content; min-width: 100%; }
.ln { min-height: 1.5em; }
.win.selected .ln.cl { background: var(--hl); }
.text.numbers .ln.cl::before { background: var(--hl); }
.text.numbers .ln { position: relative; padding-left: calc(var(--gw, 2) * 1ch + 2ch); }
.text.numbers .ln::before {
  content: attr(data-n); position: absolute; left: 0; width: calc(var(--gw, 2) * 1ch);
  text-align: right; color: var(--gutter); font-variant-numeric: tabular-nums;
}
.text.numbers .ln.cl::before { color: var(--fg); font-weight: 500; }
.rg { background: var(--region); }
.lz { background: var(--lazy); }
.im { background: var(--match); }
.pm { background: var(--paren); }
.px { background: var(--mismatch); }
.cur { background: var(--cursor); color: var(--cursor-fg) !important; border-radius: 1px; }
.cur.bar { background: transparent; color: inherit !important; box-shadow: inset 2px 0 0 var(--cursor); border-radius: 0; }
.cur.hbar { background: transparent; color: inherit !important; box-shadow: inset 0 -3px 0 var(--cursor); border-radius: 0; }
.cur.half { background: linear-gradient(transparent 55%, var(--cursor) 55%); color: inherit !important; }
.cur.ghost, .unfocused .text .cur { background: transparent; color: inherit !important; box-shadow: inset 0 0 0 1.5px var(--cursor); }
/* Evil state cursors, as evil-*-state-cursor set them: a red box in Normal, a green bar in Insert, cyan in
   Emacs state, hollow in Visual, an underline in Replace. stack.js keeps data-evil-state on the root. */
:root[data-evil-state="normal"] .win.selected .cur, :root[data-evil-state="motion"] .win.selected .cur, :root[data-evil-state="operator"] .win.selected .cur { --cursor: var(--cursor-normal); --cursor-fg: #ffffff; }
:root[data-evil-state="insert"] .win.selected .cur { --cursor: var(--cursor-insert); }
:root[data-evil-state="emacs"] .win.selected .cur { --cursor: var(--cursor-emacs); --cursor-fg: #ffffff; }
:root[data-evil-state="replace"] .win.selected .cur { --cursor: var(--cursor-replace); }
:root[data-evil-state="visual"] .win.selected .cur { --cursor: var(--cursor-visual); background: transparent; color: inherit !important; box-shadow: inset 0 0 0 1.5px var(--cursor); }
/* Snipe matches (evil-snipe-scope whole-visible) are boxes drawn over the text. */
#snipe { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#snipe div { position: absolute; background: var(--snipe); opacity: 0.45; border-radius: 2px; }
@media (prefers-reduced-motion: no-preference) {
  #frame:not(.unfocused) .cur:not(.ghost):not(.bar):not(.hbar):not(.half) { animation: blink 1.06s steps(1) 0.5s infinite; }
  #frame:not(.unfocused) .cur.bar:not(.ghost), #frame:not(.unfocused) .cur.hbar:not(.ghost) { animation: blinkline 1.06s steps(1) 0.5s infinite; }
  @keyframes blink { 50% { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px var(--cursor); } }
  @keyframes blinkline { 50% { box-shadow: none; } }
}
.kw { color: var(--kw); font-weight: 500; }
.fn { color: var(--fn); font-weight: 500; }
.st { color: var(--st); }
.dc { color: var(--dc); font-style: italic; }
.cm { color: var(--cm); font-style: italic; }
.co, .nu, .qu { color: var(--co); }
.pa { color: var(--pa); }
.pa.d0 { color: var(--rb0); } .pa.d1 { color: var(--rb1); } .pa.d2 { color: var(--rb2); } .pa.d3 { color: var(--rb3); } .pa.d4 { color: var(--rb4); } .pa.d5 { color: var(--rb5); }
.avy { background: var(--avy-bg); color: var(--avy-fg); font-weight: 700; border-radius: 2px; }
.ln.pulse { animation: pulse 0.45s ease-out; }
@keyframes pulse { from { background: var(--pulse); } to { background: transparent; } }
.text.centered .ln { max-width: calc(var(--center-cols, 100) * 1ch); margin-inline: auto; }
@media (prefers-reduced-motion: reduce) { .ln.pulse { animation: none; background: var(--pulse); } }
.modeline {
  display: flex; gap: 0 2ch; flex-wrap: wrap; align-items: center; padding: 2px 10px 2px 2px;
  background: var(--ml-bg); color: var(--ml-fg); font-size: 13px; line-height: 1.5; white-space: pre;
  font-variant-numeric: tabular-nums; border-top: 1px solid var(--rule);
}
.ml-tag {
  font-family: var(--font-ui); font-weight: 600; font-size: 12px; letter-spacing: 0.08em;
  padding: 0 8px; border-radius: 3px; background: var(--s-normal); color: var(--s-fg); margin-left: 2px;
}
.ml-tag[data-state="insert"] { background: var(--s-insert); }
.ml-tag[data-state="visual"] { background: var(--s-visual); }
.ml-tag[data-state="replace"] { background: var(--s-replace); }
.ml-tag[data-state="operator"] { background: var(--s-operator); }
.ml-tag[data-state="motion"] { background: var(--s-motion); }
.ml-tag[data-state="emacs"] { background: var(--s-emacs); }
.ml-state { color: var(--ml-dim); margin-left: 8px; }
.ml-name { font-weight: 600; }
.ml-pos, .ml-mode { color: var(--ml-dim); }
.ml-extra { color: var(--s-replace); font-weight: 500; }
.ml-cmd { margin-left: auto; color: var(--ml-fg); font-weight: 500; min-width: 6ch; text-align: right; }
.win:not(.selected) .modeline { background: var(--ml-inactive); color: var(--ml-dim); }
.win:not(.selected) .ml-tag { opacity: 0.55; }
.win:not(.selected) .ml-name { font-weight: 500; }
.unfocused .modeline { opacity: 0.85; }
#frame.bell .win.selected .modeline { animation: bell 0.18s ease-out; }
@keyframes bell { from { background: var(--bell); color: #fff; } }
#echo {
  min-height: 1.5em; padding: 3px 10px 5px; font-size: 13.5px; line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); max-height: 50%; overflow-y: auto; flex-shrink: 0;
}
#echo .prompt { color: var(--fn); font-weight: 500; }
#echo .miniline { display: flex; align-items: baseline; gap: 0; }
#echo .mb { flex: 1; min-width: 0; }
#echo .cc { color: var(--dim); min-width: 7ch; font-variant-numeric: tabular-nums; }
#echo .flash { color: var(--co); margin-left: 1ch; }
#echo .cands { display: flex; flex-direction: column; margin-top: 3px; border-top: 1px solid var(--rule); padding-top: 3px; }
#echo .cand { display: flex; gap: 2ch; padding: 0 6px; border-radius: 3px; white-space: pre; overflow: hidden; }
#echo .cand .cl { flex: 0 0 auto; min-width: 24ch; }
#echo .cand .cl b { color: var(--co); font-weight: 600; }
#echo .cand .ca { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
#echo .cand.sel { background: var(--region); }
#echo .cand.sel .ca { color: var(--fg); }
#echo .wkp { color: var(--dim); margin-right: 2ch; }
#echo .wk { display: inline-flex; gap: 0.75ch; margin-right: 2.5ch; white-space: nowrap; }
#echo .wk kbd { font-family: var(--font-mono); color: var(--kw); font-weight: 600; }
:root[data-which-key="wait"] #echo .wk { display: none; }
#corfu {
  position: absolute; z-index: 5; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 8px 24px -12px rgb(20 24 36 / 0.5);
  font-size: 13px; line-height: 1.5; padding: 3px; max-width: min(60ch, 90%); min-width: 20ch;
}
#corfu .cand { display: flex; gap: 2ch; padding: 0 6px; border-radius: 3px; white-space: pre; overflow: hidden; }
#corfu .cand .cl b { color: var(--co); font-weight: 600; }
#corfu .cand .ca { color: var(--dim); overflow: hidden; text-overflow: ellipsis; margin-left: auto; }
#corfu .cand.sel { background: var(--region); }
#input {
  position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
  font-size: 16px; resize: none; pointer-events: none;
}
@media (max-width: 560px) {
  body { padding-block: 8px; }
  .text { font-size: calc(var(--text-size) - 1px); padding-inline: 8px; }
  #menubar .hint, #menubar kbd { display: none; }
}
</style>

<div id="frame" class="unfocused">
  <nav id="menubar" aria-label="Commands">
    <span class="name">Edwin</span>
    <button type="button" data-key="ESC">Esc</button>
    <button type="button" data-cmd="evil-ex">Ex <kbd>:</kbd></button>
    <button type="button" data-cmd="list-buffers">Buffers <kbd>:ls</kbd></button>
    <button type="button" data-cmd="save-buffer">Save <kbd>:w</kbd></button>
    <button type="button" data-cmd="evil-undo">Undo <kbd>u</kbd></button>
    <button type="button" data-cmd="evil-help">Keys <kbd>:h</kbd></button>
    <button type="button" data-cmd="evil-toggle-emacs-state">Vim ⇄ Emacs <kbd>C-z</kbd></button>
    <span class="spacer"></span>
    <span class="hint">Click the text, then type. Files persist in this browser.</span>
  </nav>
  <div id="windows"></div>
  <div id="echo" aria-live="polite"></div>
</div>
<textarea id="input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Keyboard input"></textarea>

<script>
/* The shipped Scheme is scm/*.scm next to this page, fetched as the console page fetches it, while the core files load;
   require and load find the other files there by name (EdHost.sources). */
const scmLoaded = (async () => {
  const SCM = ['emacs', 'evil', 'org', 'ai', 'init', 'notes-syntax', 'address', 'markdown', 'babel', 'pi'];
  const texts = await Promise.all(SCM.map(async name => { const r = await fetch(`scm/${name}.scm`); if (!r.ok) throw new Error(`scm/${name}.scm: HTTP ${r.status}`); return r.text(); }));
  return Object.fromEntries(SCM.map((name, i) => [name + '.scm', texts[i]]));
})();
</script>

<script>
/* R9.1: boot once all the core files and the shipped Scheme have loaded, with this page as the host and #frame as the
   one frame. */
scmLoaded.then(sources => {
  EdHost.sources = sources;
  Ed.boot({ host: EdHost, frame: Ed.makeFrame(document.getElementById('frame'), { input: document.getElementById('input') }) });
}, e => { document.getElementById('echo').textContent = 'Cannot load the Scheme sources: ' + e.message; });
</script>
