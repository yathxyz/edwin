  [
    "a fairly long string to break the line",
    "another one",
  ],
  [
    "a third string here",
    "and a fourth one, longer",
  ],
]
inline = { a = 1, b = { c = 2 } }

[dependencies]
serde = { version = "1", features = ["derive"] }
long = { version = "1.0.0", features = [
  "derive",
  "a feature with a long name",
  "another-long-feature-name",
] }

[[bin]]
name = "edwin"
path = "src/main.rs"

[a.b."c d"]
# a comment before a key
x = 1
