# A TOML fixture, as taplo formats it.
title = "Edwin" # a comment
description = """
  A multi-line string,
    its blanks kept.
"""
literal = '''
    kept too
'''

[package]
name = "edwin"
keywords = [
  "an editor written in TypeScript and Scheme",
  "with a native program",
  "and tree-sitter",
]
short = [1, 2, 3]
